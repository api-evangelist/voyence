name: Voyence
description: >-
  Voyence was an enterprise software company that provided network configuration
  and change management solutions, automating critical change, compliance, and
  service-activation processes across large IT and network operations
  environments (the VoyenceControl product line). It was surfaced as a portfolio
  company of Canaan Partners and added to the API Evangelist network as a stub
  for enrichment. Enrichment research found that Voyence was acquired by EMC
  (Dell EMC) on October 30, 2007 and folded into EMC's IT/network management
  portfolio; it is a long-defunct, exited company with no live website, developer
  portal, or public API surface. There are no APIs, specifications, or artifacts
  to harvest.
